{% load static %}<!DOCTYPE html>
{% load i18n_extras %}
<html lang="{{ langue_html|default:'fr' }}">
<head><script src="{% static 'engine/js/coque_garde.js' %}" data-coque="{% url 'engine:coque' %}"></script><link rel="stylesheet" href="{% static 'engine/css/app.css' %}"><link rel="stylesheet" href="{% url 'engine:marque_css' %}"><script src="{% static 'engine/js/marque.js' %}" defer></script><script src="{% static 'engine/js/gestes_tactiles.js' %}" defer></script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% t "engine/templates/engine/page_simple.html:3:168" %}</title><script src="{% static 'engine/js/dialogues.js' %}"></script>
</head>
<body class="page-page_simple page-notifications {% block classe_page %}{% endblock %}">
<div class="header">{% include "engine/_marque_entete.html" %}</div>
<div id="toast"></div>
<div class="layout">{% block contenu %}{% endblock %}</div>
{% i18n_js %}
<script>
const $ = id => document.getElementById(id), CSRF = document.cookie.match(/gy_csrftoken=([^;]+)/)?.[1] || "{{ csrf_token }}";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => "&#" + c.charCodeAt(0) + ";");
function toast(m, err){ const t = $("toast"); t.textContent = m; t.className = err ? "err" : ""; t.style.display = "block"; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = "none", 3500); }
async function api(url, corps){ const fd = corps instanceof FormData, res = await fetch(url, corps === undefined ? {} : {method: "POST", headers: {"X-CSRFToken": CSRF, ...(fd ? {} : {"Content-Type": "application/json"})}, body: fd ? corps : JSON.stringify(corps)}); const d = await res.json().catch(() => ({})); if (!res.ok) { toast(d.erreur || tj("engine/templates/engine/page_simple.html:js:13:347", {v1: res.status}), true); throw d; } return d; }
const lire = id => Object.fromEntries([...$(id).querySelectorAll("[name]")].map(e => [e.name, e.type === "checkbox" ? e.checked : e.value]));
async function poster(url, corps){ await api(url, typeof corps === "string" ? lire(corps) : corps ?? {}); toast("OK"); charger(); }
</script>
{% block script %}{% endblock %}
<script src="{% static 'engine/js/icones.js' %}"></script>
</body>
</html>
