<!doctype html>
<html lang="{{ request.LANGUAGE_CODE|default:'fr' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{ textes.titre }}</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f3f4f6;color:#1f2937}
  main{max-width:520px;margin:1rem;padding:2rem;background:#fff;border-radius:14px;box-shadow:0 4px 24px rgba(0,0,0,.08);text-align:center}
  h1{margin:.2rem 0 1rem}
  .contact{display:inline-block;margin:1.2rem 0 .6rem;padding:.9rem 1.6rem;border-radius:10px;background:#25d366;color:#fff;font-weight:700;text-decoration:none;font-size:1.05rem}
  .contact:focus,.contact:hover{background:#1ebe5b}
  .absent{background:#fef3c7;border-radius:8px;padding:.7rem 1rem}
  a.sortie{display:block;margin-top:1rem;color:#6b7280}
</style>
</head>
<body>
<main>
  <h1>{{ textes.titre }}</h1>
  <p>{{ textes.raison }}</p>
  {% if lien %}
    <p>{{ textes.consigne }}</p>
    <a class="contact" id="contacter" href="{{ lien }}" target="_blank" rel="noopener noreferrer">{{ textes.contacter }}</a>
  {% else %}
    <p class="absent">{{ textes.contact_absent }}</p>
  {% endif %}
  <a class="sortie" href="/logout/">{{ textes.deconnexion }}</a>
</main>
</body>
</html>
